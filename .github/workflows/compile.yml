name: Compile Firmware

on:
  workflow_dispatch:
    inputs:
      keyboard:
        description: 'Keyboard Name'
        required: true
        default: 'keychron/q3_max/jis'
      keymap:
        description: 'Keymap Name'
        required: true
        default: 'default'

jobs:
  build:
    runs-on: ubuntu-latest
    container: qmkfm/qmk_cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Compile
        run: |
          qmk compile -kb ${{ github.event.inputs.keyboard }} -km ${{ github.event.inputs.keymap }}
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            *.bin
            *.hex
            *.uf2
